name: Release

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as draft release'
        required: true
        type: boolean
        default: true
      prerelease:
        description: 'Publish as prerelease'
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-tauri:
    name: Build & Release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm
            os: macos-latest
            args: '--target aarch64-apple-darwin'
            target: aarch64-apple-darwin
          - platform: macos-intel
            os: macos-latest
            args: '--target x86_64-apple-darwin'
            target: x86_64-apple-darwin
          - platform: linux-x64
            os: ubuntu-22.04
            args: ''
            target: ''
          - platform: windows-x64
            os: windows-latest
            args: ''
            target: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync version from release tag
        id: release_meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            echo "release_id=${{ github.event.release.id }}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "${TAG:-}" ]; then
            VERSION="${TAG#v}"
            node -e '
              const fs = require("fs");
              for (const file of ["package.json", "src-tauri/tauri.conf.json"]) {
                const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
                pkg.version = process.argv[1];
                fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
              }
            ' "$VERSION"
          fi

      - name: Build Tauri app and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ steps.release_meta.outputs.release_id }}
          tagName: ${{ steps.release_meta.outputs.tag_name || 'v__VERSION__' }}
          releaseName: 'pipan v__VERSION__'
          releaseBody: 'See the release assets below to download and install for your platform.'
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          args: ${{ matrix.args }}
