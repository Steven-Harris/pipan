name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as draft release'
        required: true
        type: boolean
        default: true
      prerelease:
        description: 'Publish as prerelease'
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-version:
    name: Sync version to main
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.sync.outputs.commit_sha }}
      release_id: ${{ steps.sync.outputs.release_id }}
      tag_name: ${{ steps.sync.outputs.tag_name }}
      version: ${{ steps.sync.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Update version files and CHANGELOG.md from release
        id: sync
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_DATE: ${{ github.event.release.published_at || github.event.release.created_at }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref }}
        run: |
          TAG=""
          if [ "${EVENT_NAME}" = "release" ]; then
            TAG="${RELEASE_TAG}"
            echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          elif [[ "${REF_NAME}" == refs/tags/* ]]; then
            TAG="${REF_NAME#refs/tags/}"
          fi

          if [ -n "${TAG}" ]; then
            VERSION="${TAG#v}"
            echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

            node -e '
              const fs = require("fs");
              const version = process.argv[1];
              const tag = process.argv[2];

              for (const file of ["package.json", "src-tauri/tauri.conf.json"]) {
                const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
                pkg.version = version;
                fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
              }

              const cargoTomlPath = "src-tauri/Cargo.toml";
              const cargoToml = fs.readFileSync(cargoTomlPath, "utf8");
              const updatedCargoToml = cargoToml.replace(
                /(\[package\][\s\S]*?^version\s*=\s*)"[^"]*"/m,
                `$1"${version}"`
              );
              fs.writeFileSync(cargoTomlPath, updatedCargoToml);

              const cargoLockPath = "src-tauri/Cargo.lock";
              if (fs.existsSync(cargoLockPath)) {
                const cargoLock = fs.readFileSync(cargoLockPath, "utf8");
                const updatedCargoLock = cargoLock.replace(
                  /(\[\[package\]\]\r?\nname = "pipan"\r?\nversion = )"[^"]*"/,
                  `$1"${version}"`
                );
                fs.writeFileSync(cargoLockPath, updatedCargoLock);
              }

              const changelogPath = "CHANGELOG.md";
              const defaultHeader = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n";
              const existingChangelog = fs.existsSync(changelogPath)
                ? fs.readFileSync(changelogPath, "utf8").replace(/\r\n/g, "\n")
                : defaultHeader;

              const repo = process.env.REPO || "Steven-Harris/pipan";
              const releaseUrl = process.env.RELEASE_URL || `https://github.com/${repo}/releases/tag/${tag}`;
              const releaseDate = (process.env.RELEASE_DATE || new Date().toISOString()).slice(0, 10);
              const rawBody = (process.env.RELEASE_BODY || "").replace(/\r\n/g, "\n").trim();
              const formattedBody = rawBody ? rawBody.replace(/^## /gm, "### ") : `Release ${tag}`;
              const newSection = `## [${tag}](${releaseUrl}) - ${releaseDate}\n\n${formattedBody}\n`;

              let updatedChangelog;
              const lines = existingChangelog.split("\n");
              const sectionStartIdx = lines.findIndex((line) =>
                line.startsWith(`## [${tag}]`) || line.startsWith(`## ${tag}`)
              );

              if (sectionStartIdx !== -1) {
                let sectionEndIdx = lines.findIndex(
                  (line, idx) => idx > sectionStartIdx && line.startsWith("## ")
                );
                if (sectionEndIdx === -1) sectionEndIdx = lines.length;
                const before = lines.slice(0, sectionStartIdx).join("\n").trimEnd();
                const after = lines.slice(sectionEndIdx).join("\n").trimStart();
                updatedChangelog = `${before}\n\n${newSection}${after ? `\n${after}` : ""}`;
              } else {
                const firstReleaseIdx = lines.findIndex((line) => line.startsWith("## "));
                if (firstReleaseIdx !== -1) {
                  const before = lines.slice(0, firstReleaseIdx).join("\n").trimEnd();
                  const after = lines.slice(firstReleaseIdx).join("\n").trimStart();
                  updatedChangelog = `${before}\n\n${newSection}\n${after}`;
                } else {
                  updatedChangelog = `${existingChangelog.trimEnd()}\n\n${newSection}`;
                }
              }

              fs.writeFileSync(changelogPath, updatedChangelog.trimEnd() + "\n");
            ' "${VERSION}" "${TAG}"

            if ! git diff --quiet package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock CHANGELOG.md; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock CHANGELOG.md
              git commit -m "chore(release): v${VERSION}"
              git push origin HEAD:main
              git tag -f "${TAG}" HEAD
              git push origin "refs/tags/${TAG}" --force
            fi
          fi

          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release-tauri:
    name: Build & Release (${{ matrix.platform }})
    needs: sync-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm
            os: macos-latest
            args: '--target aarch64-apple-darwin'
            target: aarch64-apple-darwin
          - platform: macos-intel
            os: macos-latest
            args: '--target x86_64-apple-darwin'
            target: x86_64-apple-darwin
          - platform: linux-x64
            os: ubuntu-22.04
            args: ''
            target: ''
          - platform: windows-x64
            os: windows-latest
            args: ''
            target: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync-version.outputs.commit_sha || github.ref }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Tauri app and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.sync-version.outputs.release_id }}
          tagName: ${{ needs.sync-version.outputs.tag_name || 'v__VERSION__' }}
          releaseName: 'pipan v__VERSION__'
          releaseBody: 'See the release assets below to download and install for your platform.'
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          args: ${{ matrix.args }}
